# Cấu hình deploy Render — Blueprint (tiêu chí 12), dùng thay railway.toml nếu chọn Render.
# File nằm trong thư mục con nên khi tạo Blueprint chọn Blueprint path = 06-lab-complete/render.yaml.
# Đường dẫn Docker bên dưới tính từ gốc repo.
services:
  - type: web
    name: day14-agent
    runtime: docker
    dockerfilePath: ./06-lab-complete/Dockerfile
    dockerContext: ./06-lab-complete
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        sync: false            # nhập giá trị trong dashboard, không ghi vào file
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"

  - type: keyvalue             # Redis-compatible của Render
    name: day14-redis
    plan: free
    region: singapore
    ipAllowList: []            # chỉ cho kết nối nội bộ từ các service trên Render
