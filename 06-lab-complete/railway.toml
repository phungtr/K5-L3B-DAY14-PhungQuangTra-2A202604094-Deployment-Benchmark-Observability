# Cấu hình deploy Railway (tiêu chí 12). Deploy từ thư mục 06-lab-complete: `railway up`
# PORT do Railway tự cấp; CMD trong Dockerfile nghe theo ${PORT:-8000}.
# Secret (AGENT_API_KEY) và REDIS_URL đặt bằng biến môi trường trên Railway, không ghi ở đây.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
